<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>英语启蒙乐园</title>
<style>
/* ===== CSS Variables ===== */
:root {
  --c1: #FF6B6B; /* coral red */
  --c2: #FFA94D; /* warm orange */
  --c3: #FFD43B; /* sunny yellow */
  --c4: #69DB7C; /* fresh green */
  --c5: #4DABF7; /* sky blue */
  --c6: #B197FC; /* soft purple */
  --c7: #F783AC; /* pink */
  --bg: #FFF9EC;
  --card-bg: #FFFFFF;
  --text: #3D3D3D;
  --text-light: #868E96;
  --radius: 24px;
  --radius-sm: 16px;
  --font-xl: 48px;
  --font-lg: 32px;
  --font-md: 22px;
  --font-sm: 18px;
  --shadow: 0 6px 24px rgba(0,0,0,0.08);
  --shadow-hover: 0 10px 32px rgba(0,0,0,0.13);
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}

/* ===== Background decorations ===== */
.bg-decor {
  position: fixed;
  pointer-events: none;
  z-index: 0;
  opacity: 0.12;
}
.cloud-1 { top: 6%; left: 5%; width: 160px; }
.cloud-2 { top: 18%; right: 8%; width: 120px; }
.cloud-3 { top: 55%; left: 3%; width: 100px; }
.star-1 { top: 10%; right: 18%; font-size: 40px; opacity: 0.2; }
.star-2 { bottom: 15%; left: 12%; font-size: 36px; opacity: 0.18; }
.star-3 { top: 40%; right: 6%; font-size: 32px; opacity: 0.2; }

/* ===== App Container ===== */
#app {
  position: relative;
  z-index: 1;
  max-width: 900px;
  margin: 0 auto;
  padding: 20px;
  min-height: 100vh;
}

/* ===== Navigation Bar ===== */
.nav-bar {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 0 20px;
}
.nav-back {
  width: 56px; height: 56px;
  border-radius: 50%;
  border: none;
  background: var(--card-bg);
  font-size: 28px;
  cursor: pointer;
  box-shadow: var(--shadow);
  transition: transform 0.15s, box-shadow 0.15s;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.nav-back:hover { transform: scale(1.08); box-shadow: var(--shadow-hover); }
.nav-back:active { transform: scale(0.95); }
.nav-title {
  font-size: var(--font-lg);
  font-weight: 700;
  color: var(--text);
}

/* ===== Pages ===== */
.page {
  display: none;
  animation: fadeSlideIn 0.35s ease;
}
.page.active { display: block; }

@keyframes fadeSlideIn {
  from { opacity: 0; transform: translateY(18px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ===== Home Page ===== */
.home-header {
  text-align: center;
  padding: 30px 0 10px;
}
.home-title {
  font-size: 52px;
  font-weight: 800;
  background: linear-gradient(135deg, var(--c1), var(--c2), var(--c3));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  margin-bottom: 6px;
}
.home-subtitle {
  font-size: var(--font-md);
  color: var(--text-light);
}
.home-mascot {
  text-align: center;
  font-size: 100px;
  margin: 14px 0 20px;
  animation: bounce 2s ease-in-out infinite;
}
@keyframes bounce {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-14px); }
}

.home-cards {
  display: flex;
  flex-direction: column;
  gap: 18px;
  padding: 0 4px;
}
.home-card {
  display: flex;
  align-items: center;
  gap: 18px;
  padding: 22px 28px;
  border-radius: var(--radius);
  border: none;
  cursor: pointer;
  color: #fff;
  font-size: var(--font-md);
  font-weight: 700;
  box-shadow: var(--shadow);
  transition: transform 0.15s, box-shadow 0.15s;
  text-align: left;
}
.home-card:hover { transform: scale(1.03); box-shadow: var(--shadow-hover); }
.home-card:active { transform: scale(0.97); }
.home-card-icon { font-size: 52px; flex-shrink: 0; }
.home-card-text { display: flex; flex-direction: column; }
.home-card-label { font-size: var(--font-lg); }
.home-card-desc { font-size: var(--font-sm); font-weight: 400; opacity: 0.85; }

/* ===== Alphabet Page ===== */
.alphabet-toolbar {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  margin-bottom: 18px;
}
.tool-btn {
  padding: 12px 22px;
  border-radius: 50px;
  border: 2.5px solid #E0D7C6;
  background: var(--card-bg);
  font-size: var(--font-sm);
  font-weight: 600;
  cursor: pointer;
  box-shadow: 0 2px 8px rgba(0,0,0,0.05);
  transition: all 0.15s;
  color: var(--text);
}
.tool-btn:hover { border-color: var(--c5); background: #F0F6FF; }
.tool-btn.active { background: var(--c5); color: #fff; border-color: var(--c5); }
.tool-btn:active { transform: scale(0.96); }

.letter-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
  gap: 12px;
}
.letter-card {
  background: var(--card-bg);
  border-radius: var(--radius-sm);
  padding: 16px 8px;
  text-align: center;
  cursor: pointer;
  box-shadow: var(--shadow);
  transition: transform 0.12s, box-shadow 0.12s, background 0.2s;
  border: 3px solid transparent;
}
.letter-card:hover { transform: scale(1.05); box-shadow: var(--shadow-hover); }
.letter-card:active { transform: scale(0.94); }
.letter-card.highlight {
  border-color: var(--c2);
  background: #FFF8E8;
  transform: scale(1.08);
  box-shadow: 0 0 20px rgba(255,169,77,0.35);
}
.letter-emoji { font-size: 34px; display: block; margin-bottom: 4px; }
.letter-upper { font-size: 36px; font-weight: 800; color: var(--c5); display: block; line-height: 1.1; }
.letter-lower { font-size: 22px; font-weight: 600; color: var(--text-light); display: block; }

/* ===== Word Page ===== */
.category-tabs {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  margin-bottom: 18px;
}
.cat-tab {
  padding: 12px 26px;
  border-radius: 50px;
  border: 2.5px solid #E0D7C6;
  background: var(--card-bg);
  font-size: var(--font-sm);
  font-weight: 600;
  cursor: pointer;
  box-shadow: 0 2px 8px rgba(0,0,0,0.05);
  transition: all 0.15s;
  color: var(--text);
}
.cat-tab:hover { border-color: var(--c5); background: #F0F6FF; }
.cat-tab.active { background: var(--c4); color: #fff; border-color: var(--c4); }
.cat-tab:active { transform: scale(0.96); }

.word-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
  gap: 14px;
}
.word-card {
  background: var(--card-bg);
  border-radius: var(--radius-sm);
  padding: 18px 10px 14px;
  text-align: center;
  cursor: pointer;
  box-shadow: var(--shadow);
  transition: transform 0.12s, box-shadow 0.12s;
  border: 3px solid transparent;
}
.word-card:hover { transform: scale(1.05); box-shadow: var(--shadow-hover); }
.word-card:active { transform: scale(0.94); }
.word-card.highlight {
  border-color: var(--c4);
  background: #F0FFF4;
  transform: scale(1.08);
  box-shadow: 0 0 20px rgba(105,219,124,0.35);
}
.word-card.bounce {
  animation: cardBounce 0.4s ease;
}
@keyframes cardBounce {
  0%, 100% { transform: scale(1); }
  30% { transform: scale(1.15); }
  60% { transform: scale(0.92); }
}
.word-emoji { font-size: 48px; display: block; margin-bottom: 6px; }
.word-text { font-size: var(--font-md); font-weight: 700; color: var(--text); }

/* ===== Phonics Page ===== */
.phonics-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
  gap: 14px;
}
.phonics-card {
  background: var(--card-bg);
  border-radius: var(--radius-sm);
  padding: 16px 10px 12px;
  text-align: center;
  cursor: pointer;
  box-shadow: var(--shadow);
  transition: transform 0.12s, box-shadow 0.12s, background 0.2s;
  border: 3px solid transparent;
}
.phonics-card:hover { transform: scale(1.05); box-shadow: var(--shadow-hover); }
.phonics-card:active { transform: scale(0.94); }
.phonics-card.highlight {
  border-color: var(--c6);
  background: #F3F0FF;
  transform: scale(1.05);
  box-shadow: 0 0 20px rgba(177,151,252,0.35);
}
.phonics-ipa {
  display: block;
  font-size: 40px;
  font-weight: 800;
  color: var(--c6);
  font-family: 'Segoe UI', 'Lucida Sans Unicode', 'Arial Unicode MS', sans-serif;
  line-height: 1.1;
}
.phonics-emoji { display: block; font-size: 34px; margin: 4px 0 2px; }
.phonics-word {
  display: block;
  font-size: var(--font-md);
  font-weight: 700;
  color: var(--text);
  margin-bottom: 8px;
}
.phonics-examples {
  display: flex;
  gap: 6px;
  justify-content: center;
  flex-wrap: wrap;
}
.phonics-example {
  padding: 6px 10px;
  border-radius: 50px;
  border: 2px solid #E0D7C6;
  background: #FFFDF7;
  font-size: 14px;
  font-weight: 600;
  color: var(--text-light);
  cursor: pointer;
}
.phonics-example:hover { border-color: var(--c6); color: var(--c6); }
.phonics-example:active { transform: scale(0.95); }

/* ===== Quiz Page ===== */
.quiz-setup {
  text-align: center;
  padding: 40px 0;
}
.quiz-mode-cards {
  display: flex;
  gap: 18px;
  justify-content: center;
  flex-wrap: wrap;
  margin: 20px 0;
}
.quiz-mode-card {
  padding: 28px 36px;
  border-radius: var(--radius);
  border: none;
  cursor: pointer;
  color: #fff;
  font-size: var(--font-lg);
  font-weight: 700;
  box-shadow: var(--shadow);
  transition: transform 0.15s, box-shadow 0.15s;
}
.quiz-mode-card:hover { transform: scale(1.05); box-shadow: var(--shadow-hover); }
.quiz-mode-card:active { transform: scale(0.96); }
.quiz-mode-icon { font-size: 56px; display: block; margin-bottom: 8px; }

.quiz-area { text-align: center; padding: 10px 0; }
.quiz-progress {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  margin-bottom: 14px;
  font-size: var(--font-md);
  font-weight: 600;
}
.progress-bar-wrap {
  flex: 1; max-width: 300px;
  height: 14px;
  background: #E8E0D0;
  border-radius: 10px;
  overflow: hidden;
}
.progress-bar-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--c4), var(--c5));
  border-radius: 10px;
  transition: width 0.3s ease;
}
.quiz-score { color: var(--c1); font-weight: 800; }

.quiz-prompt {
  font-size: 32px;
  margin: 14px 0 24px;
  font-weight: 700;
}
.quiz-speaker-btn {
  width: 90px; height: 90px;
  border-radius: 50%;
  border: none;
  background: linear-gradient(135deg, var(--c3), var(--c2));
  font-size: 46px;
  cursor: pointer;
  box-shadow: var(--shadow);
  transition: transform 0.12s;
  margin-bottom: 24px;
}
.quiz-speaker-btn:hover { transform: scale(1.08); }
.quiz-speaker-btn:active { transform: scale(0.92); }

.quiz-options {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
  max-width: 500px;
  margin: 0 auto;
}
.quiz-option {
  padding: 20px;
  border-radius: var(--radius-sm);
  border: 3px solid #E0D7C6;
  background: var(--card-bg);
  cursor: pointer;
  font-size: var(--font-lg);
  font-weight: 700;
  box-shadow: var(--shadow);
  transition: transform 0.12s, border-color 0.2s, background 0.2s;
  min-height: 80px;
  display: flex; align-items: center; justify-content: center; gap: 8px;
}
.quiz-option:hover { transform: scale(1.04); border-color: var(--c5); }
.quiz-option.correct {
  border-color: var(--c4); background: #E6FAEC;
  animation: popCorrect 0.5s ease;
}
.quiz-option.wrong {
  border-color: var(--c1); background: #FFE8E8;
  animation: shake 0.4s ease;
}
.quiz-option:disabled { pointer-events: none; }
@keyframes popCorrect {
  0% { transform: scale(1); }
  40% { transform: scale(1.1); }
  100% { transform: scale(1); }
}
@keyframes shake {
  0%, 100% { transform: translateX(0); }
  20% { transform: translateX(-8px); }
  40% { transform: translateX(8px); }
  60% { transform: translateX(-6px); }
  80% { transform: translateX(6px); }
}

/* ===== Quiz Complete ===== */
.quiz-complete {
  text-align: center;
  padding: 30px 0;
}
.quiz-complete-icon { font-size: 100px; animation: bounce 1s ease-in-out infinite; }
.quiz-complete-title { font-size: var(--font-xl); font-weight: 800; margin: 12px 0; }
.quiz-complete-score { font-size: var(--font-lg); color: var(--c1); font-weight: 700; margin-bottom: 20px; }
.complete-stars { font-size: 48px; margin: 14px 0; }

/* ===== Difficulty selector ===== */
.diff-selector {
  display: flex;
  gap: 8px;
  justify-content: center;
  margin: 12px 0;
}
.diff-btn {
  padding: 8px 18px;
  border-radius: 50px;
  border: 2px solid #ddd;
  background: #fff;
  cursor: pointer;
  font-size: 14px;
  font-weight: 600;
  transition: all 0.15s;
}
.diff-btn.active { background: var(--c6); color: #fff; border-color: var(--c6); }

/* ===== Big Action Button ===== */
.big-btn {
  display: inline-block;
  padding: 16px 44px;
  border-radius: 50px;
  border: none;
  font-size: var(--font-md);
  font-weight: 700;
  cursor: pointer;
  color: #fff;
  box-shadow: var(--shadow);
  transition: transform 0.15s, box-shadow 0.15s;
  margin: 6px;
}
.big-btn:hover { transform: scale(1.05); box-shadow: var(--shadow-hover); }
.big-btn:active { transform: scale(0.95); }

/* ===== Interactive Play ===== */
.play-progress {
  font-size: var(--font-md);
  font-weight: 700;
  color: var(--text-light);
  margin-bottom: 14px;
}
.play-card {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
  background: var(--card-bg);
  border-radius: var(--radius);
  padding: 34px 24px;
  box-shadow: var(--shadow);
  border: 3px solid var(--c2);
  margin-bottom: 18px;
}
.play-emoji { font-size: 84px; line-height: 1; }
.play-en { font-size: 34px; font-weight: 800; text-align: center; color: var(--text); }
.play-cn { font-size: var(--font-md); color: var(--text-light); font-weight: 600; }
.play-actions { display: flex; gap: 12px; flex-wrap: wrap; }
.play-complete {
  text-align: center;
  background: var(--card-bg);
  border-radius: var(--radius);
  padding: 40px 24px;
  box-shadow: var(--shadow);
}
.play-complete-icon { font-size: 72px; }
.play-complete-title { font-size: 32px; font-weight: 800; margin: 12px 0 20px; }
#playPage .cat-tab,
#playPage .tool-btn { min-height: 64px; }
.dialogue-row { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 14px; }
.dialogue-role { font-size: var(--font-sm); font-weight: 700; white-space: nowrap; padding-top: 14px; }
.bubble {
  flex: 1;
  text-align: left;
  border: 3px solid transparent;
  border-radius: 22px;
  padding: 16px 20px;
  font-size: 26px;
  font-weight: 700;
  font-family: inherit;
  cursor: pointer;
  box-shadow: var(--shadow);
  transition: transform 0.15s, border-color 0.2s;
  color: var(--text);
}
.bubble:hover { transform: scale(1.02); }
.bubble:active { transform: scale(0.97); }
.bubble-parent { background: #EAF4FF; border-color: #BFDDFF; }
.bubble-child { background: #FFF4E6; border-color: #FFD8A8; }
.bubble-cn {
  display: block;
  font-size: var(--font-sm);
  font-weight: 500;
  color: var(--text-light);
  margin-top: 4px;
}
.sub-chips { display: flex; gap: 10px; flex-wrap: wrap; margin: 4px 0 18px; }
.sub-chip {
  padding: 12px 18px;
  border-radius: 50px;
  border: 2.5px solid #E0D7C6;
  background: var(--card-bg);
  font-size: var(--font-sm);
  font-weight: 600;
  font-family: inherit;
  cursor: pointer;
}
.sub-chip.active { background: var(--c6); color: #fff; border-color: var(--c6); }
#playPage .bubble,
#playPage .sub-chip { min-height: 64px; }
.ispy-prompt { text-align: center; margin-bottom: 18px; }
.ispy-prompt .quiz-speaker-btn { margin-bottom: 10px; }
.ispy-prompt-text { font-size: 30px; font-weight: 800; }
.ispy-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 14px;
}
.ispy-tile {
  aspect-ratio: 1;
  border-radius: var(--radius-sm);
  border: 3px solid transparent;
  background: var(--card-bg);
  font-size: 56px;
  cursor: pointer;
  box-shadow: var(--shadow);
  transition: transform 0.15s, border-color 0.2s, background 0.2s;
}
.ispy-tile:hover { transform: scale(1.04); }
.ispy-tile:active { transform: scale(0.94); }
.ispy-tile.correct { border-color: var(--c4); background: #EBFBEE; }
.ispy-tile.wrong { animation: shake 0.4s ease; border-color: var(--c1); }

/* ===== hidden util ===== */
.hidden { display: none !important; }

/* ===== Playful Feedback ===== */
#fxLayer {
  position: fixed;
  inset: 0;
  pointer-events: none;
  overflow: hidden;
  z-index: 100;
}
.nav-actions {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 8px;
}
.nav-sound {
  width: 56px;
  height: 56px;
  border-radius: 50%;
  border: none;
  background: var(--card-bg);
  font-size: 24px;
  cursor: pointer;
  box-shadow: var(--shadow);
  transition: transform 0.15s, box-shadow 0.15s;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.nav-sound:hover { transform: scale(1.08); box-shadow: var(--shadow-hover); }
.nav-sound:active { transform: scale(0.95); }
.nav-mascot {
  font-size: 32px;
  line-height: 1;
  display: inline-block;
  transform-origin: 50% 90%;
}
.nav-mascot.peek { animation: mascotPeek 0.4s ease; }
.nav-mascot.cheer { animation: mascotCheer 0.7s ease; }
.nav-mascot.oops { animation: mascotOops 0.6s ease; }
.fx-particle {
  position: fixed;
  font-size: 22px;
  line-height: 1;
  animation: fxBurst 0.65s ease-out forwards;
}
.fx-confetti {
  position: fixed;
  top: -20px;
  width: 8px;
  height: 14px;
  border-radius: 2px;
  animation: fxFall 1.8s linear forwards;
}
.fx-mascot {
  position: fixed;
  left: 50%;
  top: 50%;
  font-size: 96px;
  line-height: 1;
  transform: translate(-50%, -50%);
  animation: fxDance 1.8s ease-in-out forwards;
}
@keyframes fxBurst {
  to { transform: translate(var(--dx), var(--dy)) rotate(var(--rot)); opacity: 0; }
}
@keyframes fxFall {
  to { transform: translateY(110vh) rotate(720deg); opacity: 0; }
}
@keyframes fxDance {
  0%, 100% { transform: translate(-50%, -50%) scale(1) rotate(0); opacity: 0; }
  10% { opacity: 1; }
  25% { transform: translate(-50%, -50%) scale(1.15) rotate(-10deg); }
  50% { transform: translate(-50%, -50%) scale(1.1) rotate(10deg); }
  75% { transform: translate(-50%, -50%) scale(1.15) rotate(-8deg); }
  90% { opacity: 1; }
}
@keyframes mascotPeek {
  50% { transform: translateY(-6px) scale(1.12); }
}
@keyframes mascotCheer {
  30% { transform: translateY(-12px) rotate(-8deg); }
  60% { transform: translateY(-4px) rotate(8deg); }
}
@keyframes mascotOops {
  25% { transform: rotate(-8deg); }
  75% { transform: rotate(8deg); }
}
</style>
</head>
<body>

<!-- Background Decorations -->
<svg class="bg-decor cloud-1" viewBox="0 0 200 120"><ellipse cx="60" cy="70" rx="50" ry="30" fill="#AAC4FF"/><ellipse cx="100" cy="60" rx="60" ry="35" fill="#C1D0FF"/><ellipse cx="140" cy="75" rx="45" ry="28" fill="#AAC4FF"/></svg>
<svg class="bg-decor cloud-2" viewBox="0 0 160 100"><ellipse cx="50" cy="55" rx="40" ry="25" fill="#FFD8A8"/><ellipse cx="85" cy="45" rx="50" ry="30" fill="#FFE8C8"/><ellipse cx="115" cy="58" rx="35" ry="22" fill="#FFD8A8"/></svg>
<svg class="bg-decor cloud-3" viewBox="0 0 140 90"><ellipse cx="40" cy="50" rx="35" ry="22" fill="#B4F0C8"/><ellipse cx="75" cy="42" rx="45" ry="28" fill="#D4FFE0"/><ellipse cx="105" cy="52" rx="30" ry="20" fill="#B4F0C8"/></svg>

function loadVoices() {
  voices = synth.getVoices();
  if (voices.length === 0) {
    // Safari workaround
    setTimeout(() => { voices = synth.getVoices(); }, 200);
  }
}
loadVoices();
if (speechSynthesis.onvoiceschanged !== undefined) {
  speechSynthesis.onvoiceschanged = loadVoices;
}

function getEnglishVoice() {
  // Prefer a good English voice
  const en = voices.filter(v => v.lang.startsWith('en'));
  // Prefer Google or Microsoft voices (better quality)
  const pref = en.find(v => v.name.includes('Google') || v.name.includes('Microsoft'));
  return pref || en[0] || voices[0];
}

function speak(text, callback) {
  synth.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'en-US';
  u.rate = 0.85;
  u.pitch = 1.1;
  const voice = getEnglishVoice();
  if (voice) u.voice = voice;
  if (callback) u.onend = callback;
  // Chrome requires a "priming" utterance sometimes; just speak
  synth.speak(u);
}

let soundOn = true;
let audioCtx = null;
let mascotTimer = null;

function toggleSound() {
  soundOn = !soundOn;
  const btn = document.getElementById('soundToggle');
  if (!btn) return;
  btn.textContent = soundOn ? '🔊' : '🔇';
  btn.setAttribute('aria-label', soundOn ? '关闭音效' : '开启音效');
}

function getAudioCtx() {
  if (!audioCtx) {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return null;
    try { audioCtx = new Ctx(); } catch (e) { return null; }
  }
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}

function tone(freq, startOffset, duration, type = 'sine', volume = 0.1) {
  const ctx = getAudioCtx();
  if (!ctx) return;
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  const start = ctx.currentTime + startOffset;
  osc.type = type;
  osc.frequency.setValueAtTime(freq, start);
  gain.gain.setValueAtTime(0.0001, start);
  gain.gain.exponentialRampToValueAtTime(volume, start + 0.01);
  gain.gain.exponentialRampToValueAtTime(0.0001, start + duration);
  osc.connect(gain);
  gain.connect(ctx.destination);
  osc.start(start);
  osc.stop(start + duration + 0.02);
}

function playSfx(kind) {
  if (!soundOn) return;
  if (kind === 'tap') {
    tone(660, 0, 0.08, 'sine', 0.06);
  } else if (kind === 'correct') {
    [523, 659, 784].forEach((f, i) => tone(f, i * 0.08, 0.18, 'sine', 0.1));
  } else if (kind === 'wrong') {
    tone(330, 0, 0.12, 'triangle', 0.08);
    tone(262, 0.14, 0.18, 'triangle', 0.08);
  } else if (kind === 'complete') {
    [523, 659, 784, 1047].forEach((f, i) => tone(f, i * 0.12, 0.24, 'sine', 0.1));
  }
}

function fxBurstFrom(el, count) {
  if (!el) return;
  const rect = el.getBoundingClientRect();
  fxBurst(rect.left + rect.width / 2, rect.top + rect.height / 2, count);
}

function fxBurst(x, y, count) {
  const layer = document.getElementById('fxLayer');
  if (!layer) return;
  const emojis = ['⭐', '✨', '💛', '🌟'];
  for (let i = 0; i < count; i++) {
    const p = document.createElement('span');
    p.className = 'fx-particle';
    p.textContent = emojis[i % emojis.length];
    p.style.left = x + 'px';
    p.style.top = y + 'px';
    const angle = Math.random() * Math.PI * 2;
    const dist = 40 + Math.random() * 70;
    p.style.setProperty('--dx', Math.cos(angle) * dist + 'px');
    p.style.setProperty('--dy', Math.sin(angle) * dist + 'px');
    p.style.setProperty('--rot', (Math.random() * 360 - 180) + 'deg');
    layer.appendChild(p);
    setTimeout(() => p.remove(), 800);
  }
}

function fxConfetti(count) {
  const layer = document.getElementById('fxLayer');
  if (!layer) return;
  const colors = ['#FF6B6B', '#FFD43B', '#4DABF7', '#51CF66', '#CC5DE8', '#FF922B'];
  for (let i = 0; i < count; i++) {
    const c = document.createElement('span');
    c.className = 'fx-confetti';
    c.style.left = Math.random() * 100 + '%';
    c.style.background = colors[i % colors.length];
    c.style.animationDelay = (Math.random() * 0.4) + 's';
    layer.appendChild(c);
    setTimeout(() => c.remove(), 2400);
  }
}

function fxMascot(state) {
  const el = document.getElementById('mascot');
  if (!el) return;
  clearTimeout(mascotTimer);
  el.classList.remove('peek', 'cheer', 'oops');
  void el.offsetWidth;
  el.classList.add(state);
  const durations = { peek: 400, cheer: 700, oops: 600 };
  mascotTimer = setTimeout(() => el.classList.remove(state), durations[state] || 500);
}

function fxMascotDance() {
  const layer = document.getElementById('fxLayer');
  if (!layer) return;
  const el = document.createElement('div');
  el.className = 'fx-mascot';
  el.textContent = '🐱';
  layer.appendChild(el);
  setTimeout(() => el.remove(), 1800);
}

// ===== PHONICS =====
function shuffleArray(arr) {
  const out = arr.slice();
  for (let i = out.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [out[i], out[j]] = [out[j], out[i]];
  }
  return out;
}

function phonicsAllItems() {
  return [...PHONICS_DATA.vowels.items, ...PHONICS_DATA.consonants.items];
}

function wordHasPhoneme(wordIpa, item) {
  return wordIpa.replace(/\//g, '').includes(item.ipa.replace(/\//g, ''));
}

    }, 250);
  });
}

function speakExample(idx, exampleIdx) {

function stopPhonicsAuto() {
  phonicsAutoToken++;
  if (phonicsAutoTimer) { clearTimeout(phonicsAutoTimer); phonicsAutoTimer = null; }
  synth.cancel();
  const playBtn = document.getElementById('autoPlayPhonicsBtn');
  const stopBtn = document.getElementById('stopPhonicsBtn');
  if (playBtn) playBtn.classList.remove('hidden');
  if (stopBtn) stopBtn.classList.add('hidden');
  document.querySelectorAll('.phonics-card').forEach(c => c.classList.remove('highlight'));
}

function generatePhonicsQuestions(total) {
  const all = phonicsAllItems();
  const optionCount = quizDifficulty === 'easy' ? 2 : 4;
  const questions = [];
  for (let i = 0; i < total; i++) {
    const correct = all[Math.floor(Math.random() * all.length)];
    const spokenWord = correct.examples[Math.floor(Math.random() * correct.examples.length)];
    const distractors = shuffleArray(all.filter(item =>
      item !== correct && !wordHasPhoneme(spokenWord.ipa, item)
    )).slice(0, optionCount - 1);
    questions.push({
      type: 'phonics',
      correct,
      spokenWord,
      options: shuffleArray([correct, ...distractors])
    });
  }
  return questions;
}

function autoPlayPhonics() {
  stopPhonicsAuto();
  const token = phonicsAutoToken;
  const items = PHONICS_DATA[currentPhonicsGroup].items;
  let i = 0;
  document.getElementById('autoPlayPhonicsBtn').classList.add('hidden');
  document.getElementById('stopPhonicsBtn').classList.remove('hidden');

  function playNext() {
    if (token !== phonicsAutoToken) return;
    if (i >= items.length) { stopPhonicsAuto(); return; }
    highlightPhonics(i);
    const item = items[i];
    speak(item.say, () => {
      if (token !== phonicsAutoToken) return;
      setTimeout(() => {
        if (token !== phonicsAutoToken) return;
        speak(item.examples[0].en, () => {
          if (token !== phonicsAutoToken) return;
          i++;
          phonicsAutoTimer = setTimeout(playNext, 700);
        });
      }, 250);
    });
  }
  playNext();
}

function startTprRound() {
  tprQueue = shuffleArray(TPR_DATA.map((_, i) => i)).slice(0, 8);
  tprIndex = 0;
  renderTpr();
  speakTpr();
}

function renderTpr() {
  if (!tprQueue.length) {
    tprQueue = shuffleArray(TPR_DATA.map((_, i) => i)).slice(0, 8);
    tprIndex = 0;
  }
  const content = document.getElementById('playContent');
  if (tprIndex >= tprQueue.length) {
    content.innerHTML = `
      <div class="play-complete">
        <div class="play-complete-icon">🎉</div>
        <div class="play-complete-title">完成 ${tprQueue.length} 个指令！</div>
        <button class="big-btn" style="background:var(--c4)" onclick="startTprRound()">🔄 再来一轮</button>
      </div>`;
    return;
  }
  const item = TPR_DATA[tprQueue[tprIndex]];
  content.innerHTML = `
    <div class="play-progress">${tprIndex + 1} / ${tprQueue.length}</div>
    <div class="play-card">
      <span class="play-emoji">${item.emoji}</span>
      <span class="play-en">${item.en}</span>
      <span class="play-cn">${item.cn}</span>
    </div>
    <div class="play-actions">
      <button class="tool-btn" onclick="speakTpr()">🔊 再听一遍</button>
      <button class="tool-btn active" onclick="nextTpr()">下一条 →</button>
    </div>`;
}

function speakTpr() {
  const item = TPR_DATA[tprQueue[tprIndex]];
  if (item) speak(item.en);
}

function nextTpr() {
  if (tprIndex >= tprQueue.length) return;
  tprIndex++;
  renderTpr();
  if (tprIndex >= tprQueue.length) {
    fxCelebrate();
    return;
  }
  speakTpr();
}

function fillDialogue(template, sub) {
  return template.replace(/\{x\}/g, sub.en).replace(/\{xCn\}/g, sub.cn);
}

function renderDialogue() {
  const content = document.getElementById('playContent');
  if (dialogueIndex >= DIALOGUE_DATA.length) {
    content.innerHTML = `
      <div class="play-complete">
        <div class="play-complete-icon">🎉</div>
        <div class="play-complete-title">完成 ${DIALOGUE_DATA.length} 组对话！</div>
        <button class="big-btn" style="background:var(--c4)" onclick="restartDialogue()">🔄 再来一轮</button>
      </div>`;
    return;
  }
  const d = DIALOGUE_DATA[dialogueIndex];
  const sub = d.subs[dialogueSubIndex];
  const childEn = fillDialogue(d.child.en, sub);
  const childCn = fillDialogue(d.child.cn, sub);
  content.innerHTML = `
    <div class="play-progress">${dialogueIndex + 1} / ${DIALOGUE_DATA.length} · ${d.scene}</div>
    <div class="dialogue-row">
      <span class="dialogue-role">🧑 家长</span>
      <button class="bubble bubble-parent" onclick="speakDialogue('parent')">
        ${d.parent.en}<span class="bubble-cn">${d.parent.cn}</span>
      </button>
    </div>
    <div class="dialogue-row">
      <span class="dialogue-role">🧒 孩子</span>
      <button class="bubble bubble-child" onclick="speakDialogue('child')">
        ${childEn}<span class="bubble-cn">${childCn}</span>
      </button>
    </div>
    <div class="sub-chips">
      ${d.subs.map((s, i) =>
        `<button class="sub-chip ${i === dialogueSubIndex ? 'active' : ''}" onclick="selectDialogueSub(${i})">${s.emoji} ${s.en}</button>`
      ).join('')}
    </div>
    <div class="play-actions">
      <button class="tool-btn" onclick="playDialogue()">🔊 播放对话</button>
      <button class="tool-btn active" onclick="nextDialogue()">下一个 →</button>
    </div>`;
}

function speakDialogue(role) {
  stopPlaySpeech();
  const d = DIALOGUE_DATA[dialogueIndex];
  if (!d) return;
  if (role === 'parent') speak(d.parent.en);
  else speak(fillDialogue(d.child.en, d.subs[dialogueSubIndex]));
}

function selectDialogueSub(i) {
  dialogueSubIndex = i;
  renderDialogue();
  speakDialogue('child');
}

function playDialogue() {
  stopPlaySpeech();
  const token = playSpeechToken;
  const d = DIALOGUE_DATA[dialogueIndex];
  if (!d) return;
  speak(d.parent.en, () => {
    if (token !== playSpeechToken) return;
    playTimer = setTimeout(() => {
      if (token !== playSpeechToken) return;
      speak(fillDialogue(d.child.en, d.subs[dialogueSubIndex]));
    }, 250);
  });
}

function nextDialogue() {
  stopPlaySpeech();
  dialogueIndex++;
  dialogueSubIndex = 0;
  renderDialogue();
  if (dialogueIndex >= DIALOGUE_DATA.length) fxCelebrate();
}

function restartDialogue() {
  stopPlaySpeech();
  dialogueIndex = 0;
  dialogueSubIndex = 0;
  renderDialogue();
}

function buildIspyRound() {
  const pool = shuffleArray(ISPY_DATA);
  const byColor = {};
  pool.forEach(item => {
    if (!byColor[item.color]) byColor[item.color] = item;
  });
  const colors = Object.keys(byColor);
  ispyTiles = colors.slice(0, 6).map(c => byColor[c]);
  ispyTarget = ispyTiles[Math.floor(Math.random() * ispyTiles.length)];
  ispyPromptType = Math.random() < 0.5 ? 'object' : 'color';
}

function startIspyRound() {
  ispyRound = 0;
  ispyStars = 0;
  ispyTiles = [];
  ispyLocked = false;
  nextIspyRound();
}

function nextIspyRound() {
  buildIspyRound();
  renderIspy();
  speakIspyPrompt();
}

function renderIspy() {
  const content = document.getElementById('playContent');
  if (ispyRound >= 5) {
    content.innerHTML = `
      <div class="play-complete">
        <div class="play-complete-icon">🏆</div>
        <div class="play-complete-title">太棒了！</div>
        <div class="play-progress">⭐ ${ispyStars} / 5</div>
        <button class="big-btn" style="background:var(--c4)" onclick="startIspyRound()">🔄 再玩一次</button>
      </div>`;
    return;
  }
  if (!ispyTiles.length) buildIspyRound();
  const promptEn = ispyPromptType === 'object'
    ? `Find the ${ispyTarget.en}.`
    : `Find something ${ispyTarget.color}.`;
  const promptCn = ispyPromptType === 'object'
    ? `找${ispyTarget.cn}`
    : `找${ispyTarget.colorCn}的东西`;
  content.innerHTML = `
    <div class="play-progress">${ispyRound + 1} / 5 · ⭐ ${ispyStars}</div>
    <div class="ispy-prompt">
      <button class="quiz-speaker-btn" onclick="speakIspyPrompt()">🔊</button>
      <div class="ispy-prompt-text">${promptEn}</div>
      <div class="play-cn">${promptCn}</div>
    </div>
    <div class="ispy-grid">
      ${ispyTiles.map((item, i) =>
        `<button class="ispy-tile" id="ispy-${i}" onclick="answerIspy(${i})">${item.emoji}</button>`
      ).join('')}
    </div>`;
}

function speakIspyPrompt() {
  if (!ispyTarget || ispyRound >= 5) return;
  if (ispyPromptType === 'object') speak(`Find the ${ispyTarget.en}.`);
  else speak(`Find something ${ispyTarget.color}.`);
}

function answerIspy(i) {
  if (ispyLocked) return;
  const item = ispyTiles[i];
  if (!item) return;
  const correct = ispyPromptType === 'object'
    ? item.en === ispyTarget.en
    : item.color === ispyTarget.color;
  const el = document.getElementById('ispy-' + i);
  if (!correct) {
    if (el) {
      el.classList.add('wrong');
      setTimeout(() => el.classList.remove('wrong'), 400);
    }
    playSfx('wrong');
    fxMascot('oops');
    speakIspyPrompt();
    return;
  }
  if (el) el.classList.add('correct');
  playSfx('correct');
  fxBurstFrom(el, 10);
  fxMascot('cheer');
  ispyLocked = true;
  const token = playSpeechToken;
  playTimer = setTimeout(() => {
    if (token !== playSpeechToken) return;
    playTimer = null;
    ispyStars++;
    ispyLocked = false;
    ispyRound++;
    if (ispyRound >= 5) {
      renderIspy();
      fxCelebrate();
    } else nextIspyRound();
  }, 700);
}

// ===== QUIZ =====
function setDifficulty(level) {
  quizDifficulty = level;
  document.getElementById('diffEasy').classList.toggle('active', level === 'easy');
  document.getElementById('diffNormal').classList.toggle('active', level === 'normal');
}

function showQuizSetup() {
  synth.cancel();
  hideAllPages();
  showNav('趣味练习');
  document.getElementById('quizPage').classList.add('active');
  document.getElementById('quizSetup').classList.remove('hidden');
  document.getElementById('quizActive').classList.add('hidden');
  document.getElementById('quizComplete').classList.add('hidden');
}

function generateQuestions(mode) {
  const questions = [];
  const total = 10;
  if (mode === 'phonics') return generatePhonicsQuestions(total);
  if (mode === 'letter') {
    for (let i = 0; i < total; i++) {
      const correct = LETTERS[Math.floor(Math.random() * 26)];
      const pool = [correct];
      while (pool.length < (quizDifficulty === 'easy' ? 2 : 4)) {
        const r = LETTERS[Math.floor(Math.random() * 26)];
        if (!pool.includes(r)) pool.push(r);
      }
      // Shuffle
      for (let j = pool.length - 1; j > 0; j--) {
        const k = Math.floor(Math.random() * (j + 1));
        [pool[j], pool[k]] = [pool[k], pool[j]];
      }
      questions.push({ type:'letter', correct, options: pool, display: pool.map(l => l) });
    }
  } else {
    const allWords = Object.values(WORD_DATA).flatMap(d => d.words);
    for (let i = 0; i < total; i++) {
      const correct = allWords[Math.floor(Math.random() * allWords.length)];
      const pool = [correct];
      while (pool.length < (quizDifficulty === 'easy' ? 2 : 4)) {
        const r = allWords[Math.floor(Math.random() * allWords.length)];
        if (!pool.find(w => w.en === r.en)) pool.push(r);
      }
      for (let j = pool.length - 1; j > 0; j--) {
        const k = Math.floor(Math.random() * (j + 1));
        [pool[j], pool[k]] = [pool[k], pool[j]];
      }
      questions.push({ type:'word', correct, options: pool });
    }
  }
  return questions;
}

function startQuiz(mode) {
  if (mode) currentQuizMode = mode;
  synth.cancel();
  quizQuestions = generateQuestions(currentQuizMode);
  quizIndex = 0;
  quizScore = 0;
  document.getElementById('quizSetup').classList.add('hidden');
  document.getElementById('quizComplete').classList.add('hidden');
  document.getElementById('quizActive').classList.remove('hidden');
  renderQuizQuestion();
}

function renderQuizQuestion() {
  if (quizIndex >= quizQuestions.length) return showQuizComplete();
  const q = quizQuestions[quizIndex];
  document.getElementById('quizProgressText').textContent = `第${quizIndex + 1}题/共${quizQuestions.length}题`;
  document.getElementById('progressBarFill').style.width = ((quizIndex / quizQuestions.length) * 100) + '%';
  document.getElementById('quizScoreDisplay').textContent = quizScore;

  const optsDiv = document.getElementById('quizOptions');
  optsDiv.innerHTML = q.options.map((opt, i) => {
    const label = q.type === 'letter' ? opt
      : q.type === 'word' ? opt.en
      : opt.ipa;
    const emojiPart = q.type === 'word'
      ? `<span style="font-size:34px">${opt.emoji}</span>`
      : q.type === 'phonics'
        ? `<span style="font-size:34px">${opt.examples[0].emoji}</span>`
        : '';
    return `<button class="quiz-option" id="qopt-${i}" onclick="answerQuiz(${i})">${emojiPart} ${label}</button>`;
  }).join('');

  // Speak the question after a short delay
  setTimeout(() => speakQuizQuestion(q), 400);
}

function speakQuizQuestion(q) {
  const text = q.type === 'letter' ? q.correct
    : q.type === 'word' ? q.correct.en
    : q.spokenWord.en;
  speak(text);
}

function replayQuizSound() {
  if (quizIndex < quizQuestions.length) {
    speakQuizQuestion(quizQuestions[quizIndex]);
  }
}

function answerQuiz(idx) {
  const q = quizQuestions[quizIndex];
  const selected = q.options[idx];
  const isCorrect = q.type === 'letter'
    ? selected === q.correct
    : q.type === 'word'
      ? selected.en === q.correct.en
      : selected.ipa === q.correct.ipa;

  // Disable all options
  document.querySelectorAll('.quiz-option').forEach(b => b.disabled = true);

  if (isCorrect) {
    quizScore++;
    document.getElementById('quizScoreDisplay').textContent = quizScore;
    const el = document.getElementById('qopt-' + idx);
    el.classList.add('correct');
    playSfx('correct');
    fxBurstFrom(el, 10);
    fxMascot('cheer');
    setTimeout(() => {
      quizIndex++;
      renderQuizQuestion();
    }, 900);
  } else {
    const el = document.getElementById('qopt-' + idx);
    el.classList.add('wrong');
    playSfx('wrong');
    fxMascot('oops');
    setTimeout(() => {
      speakQuizQuestion(q);
      document.querySelectorAll('.quiz-option').forEach(b => b.disabled = false);
      document.getElementById('qopt-' + idx).classList.remove('wrong');
    }, 600);
  }
}

function showQuizComplete() {
  document.getElementById('quizActive').classList.add('hidden');
  document.getElementById('quizComplete').classList.remove('hidden');
  document.getElementById('completeScore').textContent = `得分: ${quizScore} / ${quizQuestions.length}`;

  let stars = '';
  if (quizScore === quizQuestions.length) stars = '⭐⭐⭐';
  else if (quizScore >= 7) stars = '⭐⭐';
  else if (quizScore >= 4) stars = '⭐';
  else stars = '💪';
  document.getElementById('completeStars').textContent = stars;
  fxCelebrate();
}

// ===== PRIME SPEECH (iOS/Chrome workaround) =====
document.addEventListener('click', function primeSpeech() {
  // Speak a silent-ish short utterance to unlock audio context
  const u = new SpeechSynthesisUtterance('');
  u.volume = 0;
  u.rate = 1.5;
  synth.speak(u);
}, { once: true });

// Pre-render alphabet on load
renderLetters();
renderCatTabs();
renderWords();
</script>
